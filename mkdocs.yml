site_name: Alatyr — Документация
site_description: Управление сертификатами и SSH-ключами устройств для 802.1X EAP-TLS и SSH-доступа
site_url: https://s3m4rgl.github.io/alatyr-docs/
repo_url: https://github.com/s3m4rgl/alatyr-docs
docs_dir: docs

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-src
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables

plugins:
  - search:
      lang: ru

extra_css:
  - assets/css/diagram-zoom.css

extra_javascript:
  - assets/js/diagram-zoom.js

nav:
  - Обзор: index.md
  - Сценарии применения: use-cases.md
  - Знакомство с продуктом:
      - Архитектура и PKI: architecture.md
      - Расчёт ресурсов: sizing.md
      - Отказоустойчивость (HA): ha.md
      - Известные ограничения: limitations.md
      - Лицензирование: licensing.md
  - Развёртывание и настройка:
      - Установка: installation.md
      - Конфигурация: configuration.md
  - Администрирование:
      - Управление и роли: administration.md
      - Агенты: agents.md
      - SSH Key Registry: ssh-keys.md
  - Справочник и эксплуатация:
      - REST API: api.md
      - Логирование: logging.md
      - Эксплуатация: operations.md
      - Диагностика и ограничения: troubleshooting.md
