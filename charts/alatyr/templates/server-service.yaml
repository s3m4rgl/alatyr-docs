apiVersion: v1
kind: Service
metadata:
  name: alatyr-server
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: server
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: server
    {{- include "chart.selectorLabels" . | nindent 4 }}
  ports:
    - port: 8090
      targetPort: 8090
