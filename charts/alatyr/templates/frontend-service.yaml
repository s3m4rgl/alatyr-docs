apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/component: frontend
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: frontend
    {{- include "chart.selectorLabels" . | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
